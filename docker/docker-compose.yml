version: "3.8"

services:
  # PostgreSQL (팀원 D)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis (Task Queue)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Qdrant Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # FastAPI Backend (팀원 A)
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/workflow_agent
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - db
      - redis
      - qdrant
    volumes:
      - ../backend:/app/backend
      - ../ai:/app/ai

  # React Frontend (팀원 E)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ../frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  postgres_data:
  qdrant_data:
