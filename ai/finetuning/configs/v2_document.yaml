# LoRA v2: 문서 분석 특화 (팀원 C 관리)
model:
  base_model: "Qwen/Qwen3-8B"  # 팀원 B 벤치마크 결과와 동일 모델
  quantization: "4bit"  # QLoRA

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_ratio: 0.1
  max_length: 2048

data:
  train_path: "data/training/v2_document/train.jsonl"
  eval_path: "data/training/v2_document/eval.jsonl"
  eval_ratio: 0.15

output:
  output_dir: "outputs/v2_document"
  save_steps: 100
