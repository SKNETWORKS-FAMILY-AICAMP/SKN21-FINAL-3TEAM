# LoRA v1.1: 판단 특화 개선 (conditional 정확도 향상)
# 변경점: epoch 3→5, LoRA r 16→32, alpha 32→64, lr 2e-4→1.5e-4
model:
  base_model: "kakaocorp/kanana-1.5-8b-instruct-2505"
  quantization: "4bit"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

training:
  num_epochs: 5
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.5e-4
  warmup_ratio: 0.1
  max_length: 2048

data:
  train_path: "data/training/v1_judgment/train.jsonl"
  eval_path: "data/training/v1_judgment/eval.jsonl"
  eval_ratio: 0.1

output:
  output_dir: "outputs/v1_judgment_v2"
  save_steps: 100
