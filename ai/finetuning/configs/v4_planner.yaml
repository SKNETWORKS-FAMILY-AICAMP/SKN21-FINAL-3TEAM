# LoRA v4: Task Planner — Multi-step 강화 파인튜닝
# 베이스 모델: Kanana-1.5-8B (v3.1 비교 평가 결과 선정)
# v3 대비 변경: 데이터 1500건, complex/no_connector/anti_collapse 비율 증가
# 목적: 3-step+ 정확도 향상, Step Collapse Rate 감소
model:
  base_model: "kakaocorp/kanana-1.5-8b-instruct-2505"
  quantization: "4bit"  # QLoRA

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_ratio: 0.1
  max_length: 1024
  early_stopping_patience: 3

data:
  train_path: "data/training/v4_planner/train.jsonl"
  eval_path: "data/training/v4_planner/eval.jsonl"
  total_target: 1500

  # v4 카테고리 분포 (3-step+ 및 Step Collapse 방지 강화)
  distribution:
    single_step: 255      # 17% — 기본 단일 intent
    sequential: 270       # 18% — 2-step 순차 (접속사)
    parallel: 180         # 12% — 병렬 처리
    complex: 420          # 28% ← 핵심 증가 (3-4단계, 12패턴)
    no_connector: 225     # 15% ← 신규 (무접속사 자연어 복합)
    anti_collapse: 90     # 6%  ← 신규 (하드코딩 Step Collapse 방지)
    edge_case: 60         # 4%  — 오타, 초성, 모호한 입력

  # v4 약점 보강 포인트 (v3 대비 추가)
  focus_areas:
    - "3-step 이상 복합 질문 Step Collapse 방지 (28.6% → 50%+ 목표)"
    - "무접속사 자연어 패턴 ('찾아서', '보고', '바탕으로') 추가"
    - "anti-collapse 하드코딩 예제 (doc_retrieve→judgment 압축 금지)"
    - "complex 패턴 5개→12개로 확장 (다양한 intent 조합)"
    - "general intent 빈 plan 교정 유지"

output:
  output_dir: "outputs/v4_planner"
  save_steps: 100

evaluation:
  usable_rate: 0.98
  planning_score: 0.93    # v3 0.916 대비 상향
  step_collapse_rate: 0.10  # 목표: 20.4% → 10% 이하
  step3_accuracy: 0.50      # 목표: 28.6% → 50%+
