# LoRA v2: no/conditional 경계 강화 (v1 + 250건 보강)
model:
  base_model: "kakaocorp/kanana-1.5-8b-instruct-2505"
  quantization: "4bit"  # QLoRA

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.5e-4  # v1(2e-4)보다 약간 낮춤 — 기존 학습 보존 + 새 데이터 흡수
  warmup_ratio: 0.1
  max_length: 2048

data:
  train_path: "data/training/v1_judgment/train.jsonl"  # augment 병합 후 동일 경로
  eval_path: "data/training/v1_judgment/eval.jsonl"
  eval_ratio: 0.1

output:
  output_dir: "outputs/v2_judgment"
  save_steps: 100
