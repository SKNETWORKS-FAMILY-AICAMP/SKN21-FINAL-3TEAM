# LoRA v2: 문서 생성 (doc_generate) 전용 어댑터
# 회의록(meeting_minutes), 보고서(report), 제안서(proposal) JSON 생성
# 베이스 모델: Qwen3-8B (1차 추천) — 비교 대상: EXAONE-3.5-7.8B, Kanana-1.5-8B
model:
  base_model: "Qwen/Qwen3-8B"
  quantization: "4bit"  # QLoRA

model_candidates:
  - "Qwen/Qwen3-8B"
  - "LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct"
  - "kakaocorp/kanana-1.5-8b-instruct-2505"

lora:
  r: 32                      # 복잡한 JSON 스키마(15+필드) 표현력
  lora_alpha: 64              # alpha/r = 2.0
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"

training:
  num_epochs: 5
  batch_size: 4
  gradient_accumulation_steps: 4  # effective batch = 16
  learning_rate: 1e-4
  warmup_ratio: 0.1
  max_length: 2048            # 제안서 JSON ~1500토큰
  early_stopping_patience: 3

data:
  train_path: "data/training/v2_generate/train.jsonl"
  eval_path: "data/training/v2_generate/eval.jsonl"
  eval_ratio: 0.1             # 1000개 중 ~100개 eval
  total_target: 1000          # 회의록 400 + 보고서 300 + 제안서 300

# 데이터 소스별 구성 (AI Hub 46% + 합성 40% + 변형 14%)
data_sources:
  aihub: 460                  # AI Hub 원문 + GPT-4o 변환 (46%)
  synthetic: 400              # GPT-4o/Claude 합성 (40%)
  variants: 140               # 변형 데이터 (14%)

# 템플릿별 데이터 목표
templates:
  meeting_minutes: 400        # 7필드 JSON, 사용 빈도 최고 (합성 중심: AI Hub 40 + 합성 280 + 변형 80)
  report: 300                 # 12필드 JSON (AI Hub 210 + 합성 60 + 변형 30)
  proposal: 300               # 15+필드 JSON (AI Hub 210 + 합성 60 + 변형 30)

output:
  output_dir: "outputs/v2_generate"
  save_steps: 100

evaluation:
  json_valid_rate: 0.98       # JSON 유효율 >98%
  field_completeness: 0.95    # 필수 필드 존재 >95%
  field_accuracy: 0.99        # 필드명 정확도 >99%
