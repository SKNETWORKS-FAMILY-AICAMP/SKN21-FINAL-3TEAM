# LoRA v3: 하드코딩 + conditional 보강 (Type5 재량표현 + no/conditional 경계)
model:
  base_model: "kakaocorp/kanana-1.5-8b-instruct-2505"
  quantization: "4bit"  # QLoRA

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_ratio: 0.1
  max_length: 2048

data:
  train_path: "data/training/v1_judgment_v3/train.jsonl"
  eval_path: "data/training/v1_judgment_v3/eval.jsonl"
  eval_ratio: 0.1

output:
  output_dir: "outputs/v3_judgment"
  save_steps: 100
