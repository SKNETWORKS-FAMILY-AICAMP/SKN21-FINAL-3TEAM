name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: EC2 SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/SKN21-FINAL-3TEAM
            git pull origin develop
            source .venv/bin/activate
            pip install -r requirements.txt
            pkill -f uvicorn || true
            export PYTHONPATH=/home/ubuntu/SKN21-FINAL-3TEAM:/home/ubuntu/SKN21-FINAL-3TEAM/backend
            setsid nohup /home/ubuntu/SKN21-FINAL-3TEAM/.venv/bin/uvicorn backend.app.main:app \
              --host 0.0.0.0 \
              --port 8000 \
              > server.log 2>&1 < /dev/null &
            echo "배포 완료"
