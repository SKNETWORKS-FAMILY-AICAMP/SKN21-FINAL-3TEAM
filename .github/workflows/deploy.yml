name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: EC2 SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/SKN21-FINAL-3TEAM
            git fetch origin develop
            git reset --hard origin/develop
            find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            source .venv/bin/activate
            pip install -r requirements.txt
            cd backend
            python3 -c "
            from dotenv import load_dotenv
            import os, sys
            sys.path.insert(0, '.')
            load_dotenv('../.env')
            from alembic.config import Config
            from alembic import command
            cfg = Config('alembic.ini')
            db_url = os.getenv('DATABASE_URL', '').replace('postgresql+asyncpg://', 'postgresql://')
            if db_url: cfg.set_main_option('sqlalchemy.url', db_url)
            try:
                command.upgrade(cfg, 'heads')
            except Exception as e:
                print(f'Migration warning: {e}')
                command.stamp(cfg, 'heads')
                print('Stamped to heads')
            print('Migration complete')
            "
            cd ..
            sudo systemctl restart workflow-agent
            sleep 5
            sudo systemctl status workflow-agent --no-pager || true
            curl -s http://localhost:8000/health || echo "서버 시작 대기 중..."
            echo "배포 완료"
